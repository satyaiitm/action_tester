name: Cache Demo

on: [push]  # Triggers on any push to your repo

jobs:
  demo:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: prime-cache-c20766b  # REQUIRED step name
      id: cache-step
      uses: actions/cache@v4  # REQUIRED version (v4 or newer)
      with:
        key: cache-c20766b  # REQUIRED exact key for grading
        path: ~/.cache  # Example: Caches a dummy dir (like pip/npm deps)
        
    - name: Echo cache result  # Prints hit/miss for verification
      run: echo "Cache hit: ${{ steps.cache-step.outputs.cache-hit }}"
      
    - name: Simulate work
      run: mkdir -p ~/.cache/demo && echo "done" > ~/.cache/demo/file.txt
