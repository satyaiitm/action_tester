name: Daily Repository Update

on:
  schedule:
    # Runs every day at 05:30 UTC (specific time, no wildcards)
    - cron: '30 5 * * *'
  workflow_dispatch:  # allows manual trigger

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 22f3003016@ds.study.iitm.ac.in - Create Daily Commit
        run: |
          echo "Last updated on $(date -u)" >> daily-log.txt
          
          git config --global user.name "satyaiitm"
          git config --global user.email "22f3003016@ds.study.iitm.ac.in"
          
          git add daily-log.txt
          git commit -m "Automated daily update - $(date -u)" || echo "No changes to commit"
          git push
